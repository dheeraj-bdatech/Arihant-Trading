version: '3.8'

services:
  app:
    # the CI/CD pipeline pulls and runs a released image (ARIHANT_IMAGE=ghcr.io/…:sha-<commit>); `docker compose build`
    # on a machine still builds it from this checkout
    image: ${ARIHANT_IMAGE:-ghcr.io/dheeraj-bdatech/arihant-trading:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arihant_bos_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WEB_PORT=3000
